name: Smoke Test Fabric Server
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Start dedicated test server
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 140s gradle runServer --console=plain > /tmp/smoke.log 2>&1
          code=$?
          set -e
          tail -n 130 /tmp/smoke.log
          if grep -Eq "Failed to start|Mixin apply failed|MixinTransformerError|InjectionError|Caused by:|NoSuchMethodError|NoClassDefFoundError" /tmp/smoke.log; then
            echo "Found crash or mixin error in test server output" >&2
            exit 1
          fi
          if ! grep -E "Done \(" /tmp/smoke.log; then
            echo "Dedicated server never reached Done (exit $code)" >&2
            exit 1
          fi
          echo "Dedicated server reached ready state"
