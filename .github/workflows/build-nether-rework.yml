name: Build Nether Rework
on:
  workflow_dispatch:
  push:
    paths:
      - 'nether-rework/**'
      - '.github/workflows/build-nether-rework.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nether-rework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nether-rework-0.2.0-fabric-1.21.11
          path: nether-rework/build/libs/nether-rework-0.2.0.jar
